<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" fill="none">
<defs>
  <style>
    @keyframes glowp { 0%,100%{opacity:.18} 50%{opacity:.42} }
    @keyframes slide { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    .gp { animation: glowp 3.6s ease-in-out infinite; }
    .sl { animation: slide 4.8s ease-in-out infinite; transform-origin:center; }
  </style>
</defs>
<rect width="780" height="330" rx="22" fill="#2b1e27"/>
<rect x="1" y="1" width="778" height="328" rx="22" fill="none" stroke="#543543" stroke-width="2"/>
<g class="gp"><ellipse cx="86" cy="46" rx="96" ry="54" fill="#f291b4"/></g>
<rect x="0" y="34" width="7" height="262" rx="4" fill="#f291b4"/>

<g class="sl">
  <text x="38" y="62" font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="28" font-weight="700" fill="#f8a2c0">04</text>
  <text x="92" y="62" font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="35" font-weight="700" fill="#fdeef4">netspeed</text>
</g>
<text x="38" y="106" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="600" fill="#f8a2c0">网络测速 + 内存悬浮球</text>
<text x="38" y="150" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" fill="#c495a6">下载/上传/延迟/抖动，独立进程省内存。</text><text x="38" y="188" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" fill="#c495a6">APK 69 KB，纯 Java 无第三方依赖。</text>
