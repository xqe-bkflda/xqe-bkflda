<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#231821"/><stop offset="100%" stop-color="#2e1f29"/>
  </linearGradient>
  <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fdeef4"/>
    <stop offset="42%" stop-color="#f888ae"/>
    <stop offset="52%" stop-color="#f8a2c0"/>
    <stop offset="62%" stop-color="#f888ae"/>
    <stop offset="100%" stop-color="#fdeef4"/>
    <animate attributeName="x1" values="-1;1;-1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2;0" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="gl" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#e77fa4" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#e77fa4" stop-opacity="0"/>
  </radialGradient>
  <style>
    @keyframes fl { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes tw { 0%,100%{opacity:.18} 50%{opacity:.9} }
    @keyframes pop { from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1} }
    .fl { animation: fl 5.4s ease-in-out infinite; transform-origin:center; }
    .tw { animation: tw 2.8s ease-in-out infinite; }
    .pp { animation: pop 1.1s cubic-bezier(.16,1,.3,1) both; transform-origin:640px 178px; }
  </style>
</defs>

<rect width="1280" height="340" fill="url(#bg)"/>
<ellipse cx="380" cy="60" rx="470" ry="270" fill="url(#gl)"/>
<ellipse cx="940" cy="300" rx="380" ry="220" fill="url(#gl)" opacity="0.65"/>

<g class="tw"><circle cx="1010" cy="74" r="4" fill="#f8a2c0"/></g>
<g class="tw" style="animation-delay:.8s"><circle cx="1156" cy="150" r="3" fill="#e77fa4"/></g>
<g class="tw" style="animation-delay:1.5s"><circle cx="270" cy="252" r="3.4" fill="#f8a2c0"/></g>
<g class="tw" style="animation-delay:.4s"><circle cx="150" cy="86" r="2.8" fill="#e77fa4"/></g>

<g class="fl" style="animation-delay:.3s">
  <path d="M1046 132c0-12 9-21 20-21 7 0 13 4 16 9 3-5 9-9 16-9 11 0 20 9 20 21 0 22-36 45-36 45s-36-23-36-45z" fill="#f888ae" opacity="0.9"/>
</g>
<g class="fl" style="animation-delay:1.4s">
  <path d="M212 208c0-8 6-14 14-14 5 0 9 3 11 6 2-3 6-6 11-6 8 0 14 6 14 14 0 15-25 31-25 31s-25-16-25-31z" fill="#e77fa4" opacity="0.85"/>
</g>

<g class="pp">
  <text x="640" y="212" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="112" font-weight="800" letter-spacing="-2" fill="url(#tx)">xqe-bkflda</text>
</g>
</svg>